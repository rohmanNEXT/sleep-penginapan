<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Big Red Rising Sun -->
  <circle cx="400" cy="220" r="130" fill="#ff6b6b" stroke="#1a1a1a" stroke-width="6"/>
  
  <!-- Mt. Fuji Silhouette -->
  <g transform="translate(100, 200)">
    <!-- Base Mountain -->
    <path d="M 0 320 Q 200 200 260 50 L 340 50 Q 400 200 600 320 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="6"/>
    <!-- Snow Cap -->
    <path d="M 220 115 Q 260 50 260 50 L 340 50 Q 340 50 380 115 L 350 140 L 320 110 L 300 150 L 280 110 L 250 140 Z" fill="#eee9e0" stroke="#1a1a1a" stroke-width="6"/>
  </g>
  
  <!-- Torii Gate Silhouette on right side -->
  <g transform="translate(580, 280)">
    <rect x="20" y="50" width="15" height="190" fill="#ff6b6b" stroke="#1a1a1a" stroke-width="5"/>
    <rect x="105" y="50" width="15" height="190" fill="#ff6b6b" stroke="#1a1a1a" stroke-width="5"/>
    <!-- Top curved beams -->
    <path d="M 0 20 C 40 25 100 25 140 20 L 140 38 C 100 42 40 42 0 38 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="5" y="45" width="130" height="10" fill="#ff6b6b" stroke="#1a1a1a" stroke-width="4"/>
    <rect x="20" y="80" width="100" height="10" fill="#ffcc00" stroke="#1a1a1a" stroke-width="4"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="520" width="800" height="80" fill="#eee9e0" stroke="#1a1a1a" stroke-width="6"/>
  
  <!-- Text Label -->
  <rect x="50" y="50" width="220" height="60" fill="white" stroke="#1a1a1a" stroke-width="5" rx="10"/>
  <text x="90" y="92" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="900" fill="#1a1a1a" letter-spacing="2">JAPAN</text>
</svg>
