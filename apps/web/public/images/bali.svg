<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#ffcc00"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Big Orange Sun -->
  <circle cx="400" cy="220" r="110" fill="#ff6b00" stroke="#1a1a1a" stroke-width="6"/>
  
  <!-- Balinese Temple Split Gate (Candi Bentar) -->
  <g transform="translate(180, 100)">
    <!-- Left Gate Wing -->
    <path d="M 120 400 L 0 400 L 0 350 L 50 250 L 30 230 L 70 150 L 50 130 L 100 50 L 120 50 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="5"/>
    <rect x="70" y="320" width="30" height="80" fill="#eee9e0" stroke="#1a1a1a" stroke-width="4"/>
    <rect x="30" y="270" width="20" height="50" fill="#eee9e0" stroke="#1a1a1a" stroke-width="4"/>
    
    <!-- Right Gate Wing -->
    <path d="M 220 400 L 340 400 L 340 350 L 290 250 L 310 230 L 270 150 L 290 130 L 240 50 L 220 50 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="5"/>
    <rect x="240" y="320" width="30" height="80" fill="#eee9e0" stroke="#1a1a1a" stroke-width="4"/>
    <rect x="290" y="270" width="20" height="50" fill="#eee9e0" stroke="#1a1a1a" stroke-width="4"/>
    
    <!-- Gate Steps -->
    <rect x="90" y="380" width="160" height="20" fill="#eee9e0" stroke="#1a1a1a" stroke-width="5"/>
  </g>
  
  <!-- Waves -->
  <path d="M 0 500 Q 200 470 400 500 T 800 500 L 800 600 L 0 600 Z" fill="#0055ff" stroke="#1a1a1a" stroke-width="6"/>
  <path d="M 0 530 Q 200 510 400 530 T 800 530 L 800 600 L 0 600 Z" fill="#00aaff" stroke="#1a1a1a" stroke-width="6"/>
  
  <!-- Text Label -->
  <rect x="50" y="50" width="200" height="60" fill="white" stroke="#1a1a1a" stroke-width="5" rx="10"/>
  <text x="95" y="92" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="900" fill="#1a1a1a" letter-spacing="2">BALI</text>
</svg>
