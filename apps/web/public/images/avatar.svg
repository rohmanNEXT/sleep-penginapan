<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Neo-Brutalist avatar style -->
  <circle cx="50" cy="50" r="48" fill="#ffcc00" stroke="#1a1a1a" stroke-width="4"/>
  
  <!-- Face/Cheeks -->
  <circle cx="50" cy="50" r="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Eyes -->
  <rect x="38" y="40" width="8" height="12" fill="#1a1a1a" rx="2"/>
  <rect x="54" y="40" width="8" height="12" fill="#1a1a1a" rx="2"/>
  
  <!-- Blush -->
  <ellipse cx="32" cy="58" rx="5" ry="3" fill="#ff6b6b"/>
  <ellipse cx="68" cy="58" rx="5" ry="3" fill="#ff6b6b"/>
  
  <!-- Smile -->
  <path d="M 42 62 Q 50 70 58 62" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Hair / Cap -->
  <path d="M 15 40 Q 50 15 85 40 L 80 30 Q 50 5 20 30 Z" fill="#0055ff" stroke="#1a1a1a" stroke-width="3"/>
