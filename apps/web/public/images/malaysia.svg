<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0055ff"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Moon and Star -->
  <path d="M 120 150 A 60 60 0 1 0 240 150 A 50 50 0 1 1 120 150 Z" fill="#ffcc00" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Petronas Towers Styled Shapes -->
  <g transform="translate(300, 80)">
    <!-- Tower 1 -->
    <rect x="30" y="80" width="50" height="380" fill="#eee9e0" stroke="#1a1a1a" stroke-width="6" rx="5"/>
    <rect x="20" y="160" width="70" height="300" fill="#eee9e0" stroke="#1a1a1a" stroke-width="6" rx="5"/>
    <rect x="10" y="260" width="90" height="200" fill="#eee9e0" stroke="#1a1a1a" stroke-width="6" rx="5"/>
    <path d="M 55 80 L 55 20" stroke="#1a1a1a" stroke-width="6"/>
    
    <!-- Tower 2 -->
    <rect x="150" y="80" width="50" height="380" fill="#eee9e0" stroke="#1a1a1a" stroke-width="6" rx="5"/>
    <rect x="140" y="160" width="70" height="300" fill="#eee9e0" stroke="#1a1a1a" stroke-width="6" rx="5"/>
    <rect x="130" y="260" width="90" height="200" fill="#eee9e0" stroke="#1a1a1a" stroke-width="6" rx="5"/>
    <path d="M 175 80 L 175 20" stroke="#1a1a1a" stroke-width="6"/>
    
    <!-- Skybridge -->
    <rect x="80" y="220" width="70" height="20" fill="#ff6b6b" stroke="#1a1a1a" stroke-width="5"/>
  </g>
  
  <!-- Base Ground -->
  <rect x="0" y="520" width="800" height="80" fill="#ff6b6b" stroke="#1a1a1a" stroke-width="6"/>
  
  <!-- Text Label -->
  <rect x="50" y="480" width="250" height="60" fill="white" stroke="#1a1a1a" stroke-width="5" rx="10"/>
  <text x="70" y="522" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="900" fill="#1a1a1a" letter-spacing="2">MALAYSIA</text>
</svg>
